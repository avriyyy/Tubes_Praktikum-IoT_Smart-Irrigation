name: Deploy dashboard to Coolify

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    steps:
      - name: Call Coolify deploy webhook
        run: |
          test -n "${{ secrets.COOLIFY_DEPLOY_HOOK }}" || { echo "missing COOLIFY_DEPLOY_HOOK secret"; exit 1; }
          curl -fsS -m 90 -X POST "${{ secrets.COOLIFY_DEPLOY_HOOK }}" -o /dev/null -w "hook:%{http_code}\n"
